services:

  mongo:
    container_name: pagopa-posgw-mongo
    image: mongo@sha256:d343c378b5c6e2fe373174abcf4a877be0dfc721b5d0b9d582204dccb1c00b86
    env_file: mongodb/mongodb.env
    ports:
      - "${MONGO_PORT}:27017"
    networks:
      - pagopa-posgw-net
    healthcheck:
      test: echo 'db.runCommand({serverStatus:1}).ok' | mongosh admin --username admin --password password --quiet | grep 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s
    entrypoint:
      - bash
      - -c
      - |
        openssl rand -base64 756 > /data/replica.key 
        chmod 400 /data/replica.key
        chown 999:999 /data/replica.key
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --port 27017 --keyFile /data/replica.key

  mongo-init:
    container_name: posgw-mongo-init
    image: alpine/mongosh@sha256:2d7a9cb13f433ae72c13019db935e74831359a022f0a89282e5294cf578db3bc
    # connects to the mongo service and runs the script.
    # it runs once and then exit
    command: mongosh --host pagopa-posgw-mongo --port 27017 --username admin --password password --file /scripts/mongo-init.js
    volumes:
      - ./mongodb/mongo-init.js:/scripts/mongo-init.js:ro
    networks:
      - pagopa-posgw-net
    depends_on:
      mongo:
        condition: service_healthy

  mongo-express:
    container_name: pagopa-posgw-mongo-express
    image: mongo-express@sha256:1b23d7976f0210dbec74045c209e52fbb26d29b2e873d6c6fa3d3f0ae32c2a64
    env_file: mongodb/mongo-express.env
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    networks:
      - pagopa-posgw-net
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  redis:
    container_name: pagopa-posgw-redis
    image: redis@sha256:009cc37796fbdbe1b631b4cc0582bed167e5e403ed8bcd06f77eb6cb5aeb6f93
    env_file: redis/redis.env
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - pagopa-posgw-net

  redis-insight:
    container_name: pagopa-posgw-redis-insight
    image: redislabs/redisinsight@sha256:55542a762210bb1cd681410282642bac0970f780f39bc134565394a81b1f1fd9
    ports:
      - "${REDIS_INSIGHT_PORT}:5540"
    networks:
      - pagopa-posgw-net

  azure-service-bus-sqledge:
    container_name: pagopa-posgw-azure-service-bus-sqledge
    image: "mcr.microsoft.com/azure-sql-edge:latest@sha256:902628a8be89e35dfb7895ca31d602974c7bafde4d583a0d0873844feb1c42cf"
    networks:
      - pagopa-posgw-net
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

  azure-service-bus-emulator:
    container_name: pagopa-posgw-azure-service-bus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
    depends_on:
      - azure-service-bus-sqledge
    ports:
      - "5672:5672"
      - "${AZURE_SERVICE_BUS_EMULATOR_HTTP_PORT}:5300"
    environment:
      SQL_SERVER: azure-service-bus-sqledge
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: 5300
      SQL_WAIT_INTERVAL: 15
    volumes:
      - ./azure-service-bus-emulator/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    networks:
      - pagopa-posgw-net

  azure-service-bus-explorer:
    container_name: pagopa-posgw-azure-service-bus-explorer
    image: ghcr.io/tombiddulph/service-bus-emulator-explorer:latest@sha256:e5749118ea34bb22ae0977c1c2dadca01f44731403f0e950133d61a6d72a779f
    platform: linux/amd64
    depends_on:
      - azure-service-bus-emulator
    ports:
      - "${AZURE_SERVICE_BUS_EXPLORER_UI_PORT}:8080"
      - "${AZURE_SERVICE_BUS_EXPLORER_SECONDARY_PORT}:8081"
    environment:
      ServiceBus__ConnectionString: "Endpoint=sb://azure-service-bus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ServiceBus__AdministrationConnectionString: "Endpoint=sb://azure-service-bus-emulator:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ServiceBus__RefreshIntervalMs: 5000
      ASPNETCORE_ENVIRONMENT: local
    networks:
      - pagopa-posgw-net

  traefik:
    container_name: pagopa-posgw-traefik
    image: traefik:v2.7@sha256:41bfa070b43184314a1fd86d5b68d367d3f744e972ca3fe44a8875f69935c2d7
    ports:
      - "8000:80"
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $PWD/traefik_conf:/etc/traefik
      - $PWD/traefik_logs:/traefik_logs
    networks:
      - pagopa-posgw-net

  # SigNoz - Complete observability stack (SigNoz + ClickHouse + Zookeeper)
  # Init container to prepare ClickHouse
  signoz-init-clickhouse:
    container_name: pagopa-posgw-signoz-init-clickhouse
    image: clickhouse/clickhouse-server:25.5.6@sha256:4536143e22dc9bddb217c7e610f6b7ed5e6efd8fefdbc61acdeadb5d8022213a
    tty: true
    networks:
      - pagopa-posgw-net
    volumes:
      - ./signoz-data/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
    entrypoint: ["/bin/bash", "-c"]
    command: # auto-downloaded, this is used to calculate metrics like percentiles, latency etc.
      - |
        ARCH=$$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')
        wget -nv -O /var/lib/clickhouse/user_scripts/histogram-quantile "https://github.com/SigNoz/signoz/releases/download/v0.104.0/histogram-quantile-linux-$${ARCH}"
        chmod +x /var/lib/clickhouse/user_scripts/histogram-quantile

  # Zookeeper for ClickHouse coordination
  signoz-zookeeper:
    container_name: pagopa-posgw-signoz-zookeeper
    image: signoz/zookeeper:3.7.1@sha256:fcc4a3288154ccaa3bdb5ae6dc10180c084d29a8a6a26b62ac8e30a8940dc2e6
    networks:
      - pagopa-posgw-net
    volumes:
      - signoz-zookeeper-data:/bitnami/zookeeper
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/commands/ruok"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ClickHouse - Data storage backend
  signoz-clickhouse:
    container_name: pagopa-posgw-signoz-clickhouse
    image: clickhouse/clickhouse-server:25.5.6@sha256:4536143e22dc9bddb217c7e610f6b7ed5e6efd8fefdbc61acdeadb5d8022213a
    tty: true
    depends_on:
      signoz-init-clickhouse:
        condition: service_completed_successfully
      signoz-zookeeper:
        condition: service_healthy
    networks:
      - pagopa-posgw-net
    ports:
      - "9001:9000"
      - "8123:8123"
    volumes:
      - signoz-clickhouse-data:/var/lib/clickhouse/
      - ./signoz-data/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
      - ./signoz-data/clickhouse-config/config.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # schema migrator - creates ClickHouse databases
  signoz-schema-migrator:
    container_name: pagopa-posgw-signoz-schema-migrator
    image: signoz/signoz-schema-migrator:v0.129.12@sha256:43044b0666c60ad9c0e8c1240d478f846d0c2b7fccfea142fa043f327c8be279
    command: ["sync", "--dsn=tcp://signoz-clickhouse:9000", "--dev"]
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    networks:
      - pagopa-posgw-net

  # SigNoz UI and query service
  signoz:
    container_name: pagopa-posgw-signoz
    image: signoz/signoz:v0.104.0@sha256:11bc581c5cb8cb003d5d822b611c427c57ce53eba8b44c00ceedc963bc4c0b26
    depends_on:
      signoz-schema-migrator:
        condition: service_completed_successfully
    networks:
      - pagopa-posgw-net
    ports:
      - "${SIGNOZ_PORT}:8080"
    environment:
      - ClickHouseUrl=tcp://signoz-clickhouse:9000
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=false
      - SIGNOZ_LOCAL_DB_PATH=/var/lib/signoz/signoz.db
    volumes:
      - signoz-data:/var/lib/signoz
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenTelemetry Collector - receives telemetry data
  signoz-otel-collector:
    container_name: pagopa-posgw-signoz-otel-collector
    image: signoz/signoz-otel-collector:v0.129.12@sha256:84df7d9786ce12ee5983fc8460225371a204bca6320c85717801bf110b84ed65
    command: ["--config=/etc/otel-collector-config.yaml"]
    depends_on:
      signoz:
        condition: service_healthy
    networks:
      - pagopa-posgw-net
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    volumes:
      - ./signoz-data/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - CLICKHOUSE_DSN=tcp://signoz-clickhouse:9000
      - LOW_CARDINAL_EXCEPTION_GROUPING=false

  pagopa-posgw-transactions-handler:
    container_name: pagopa-posgw-transactions-handler
    env_file: pagopa-posgw-transactions-handler/transactions-handler.env
    build:
      context: .
      args:
        POSGW_TRANSACTIONS_HANDLER_GIT_REF: ${POSGW_TRANSACTIONS_HANDLER_GIT_REF}
      dockerfile: pagopa-posgw-transactions-handler/Dockerfile.transactions-handler.${POSGW_TRANSACTIONS_HANDLER_COMPILATION_MODE:-native}
    ports:
        - "${POSGW_TRANSACTIONS_HANDLER_PORT}:8080"
    networks:
      - pagopa-posgw-net
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      signoz-otel-collector:
        condition: service_started

  pagopa-posgw-debtposition-handler:
    container_name: pagopa-posgw-debtposition-handler
    env_file: pagopa-posgw-debtposition-handler/debtposition-handler.env
    build:
      context: .
      args:
        POSGW_DEBTPOSITION_HANDLER_GIT_REF: ${POSGW_DEBTPOSITION_HANDLER_GIT_REF}
      dockerfile: pagopa-posgw-debtposition-handler/Dockerfile.debtposition-handler.${POSGW_DEBTPOSITION_HANDLER_COMPILATION_MODE:-native}
    ports:
      - "${POSGW_DEBTPOSITION_HANDLER_PORT}:8080"
    networks:
      - pagopa-posgw-net
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      signoz-otel-collector:
        condition: service_started

  ec-mock:
    container_name: ec-mock
    build:
      context: .
      dockerfile: ec-mock/Dockerfile.ec-mock
    ports:
      - "${EC_MOCK_PORT:-3000}:3000"
    volumes:
      - ./ec-mock/ec-mock.json:/config/ec-server.json
      - ./ec-mock/middleware.js:/config/middleware.js:ro
    networks:
      - pagopa-posgw-net

networks:
  pagopa-posgw-net:
    name: pagopa-posgw-net
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450

volumes:
  signoz-data:
  signoz-zookeeper-data:
  signoz-clickhouse-data: